name: Validate cluster automation
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Ansible dependencies
        run: |
          python -m pip install ansible-core==2.16.3
          ansible-galaxy collection install -r ansible/collections/requirements.yml
      - name: Check scripts and Ansible syntax without lab secrets
        run: scripts/check-static.sh
