---
- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Create shared home mount point
  ansible.builtin.file:
    path: /home/hpc
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Mount shared home tree from controller
  ansible.posix.mount:
    path: /home/hpc
    src: '{{ ldap_server_name }}:/home/hpc'
    fstype: nfs4
    opts: rw,hard,_netdev,nofail,x-systemd.automount
    state: mounted
