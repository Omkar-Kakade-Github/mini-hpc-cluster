---
- name: Restart munge
  ansible.builtin.service:
    name: munge
    state: restarted

- name: Restart mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted

- name: Restart slurmdbd
  ansible.builtin.service:
    name: slurmdbd
    state: restarted

- name: Restart slurmctld
  ansible.builtin.service:
    name: slurmctld
    state: restarted

- name: Restart slurmd
  ansible.builtin.service:
    name: slurmd
    state: restarted
