---
- name: Install MariaDB and Slurm accounting packages
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
      - slurmdbd
      - slurm-client
      - slurm-wlm-basic-plugins
      - slurm-wlm-mysql-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Size MariaDB for the four-GiB lab controller
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/90-mini-hpc-slurm.cnf
    content: |
      [mariadbd]
      innodb_buffer_pool_size=512M
      innodb_lock_wait_timeout=900
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart mariadb
    - Restart slurmdbd

- name: Keep MariaDB running after reboot
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started

- name: Create Slurm accounting database
  community.mysql.mysql_db:
    name: slurm_acct_db
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Grant Slurm its database credentials
  community.mysql.mysql_user:
    name: slurm
    host: localhost
    password: "{{ lookup('file', lab_secrets_dir + '/slurm_db_password') | trim }}"
    priv: 'slurm_acct_db.*:ALL'
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Create Slurm configuration directory
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure protected Slurm database daemon
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: '0600'
  no_log: true
  notify: Restart slurmdbd

- name: Keep slurmdbd running after reboot
  ansible.builtin.service:
    name: slurmdbd
    enabled: true
    state: started
